<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" font-family="sans-serif">
  <rect width="420" height="320" fill="white"/>
  <text x="210" y="20" text-anchor="middle" font-size="14" font-weight="bold">Movie Performance vs. Audience Discussion</text>

  <!-- axes -->
  <line x1="60" y1="270" x2="390" y2="270" stroke="black" stroke-width="1.5"/>
  <line x1="60" y1="270" x2="60" y2="40" stroke="black" stroke-width="1.5"/>
  <text x="225" y="300" text-anchor="middle" font-size="12">Audience Rating (x)</text>
  <text x="20" y="155" text-anchor="middle" font-size="12" transform="rotate(-90 20 155)">Discussion Level (y)</text>

  <!-- points: size = revenue, color = genre (grayscale stand-in) -->
  <circle cx="120" cy="230" r="6" fill="#888"/>
  <circle cx="150" cy="200" r="10" fill="#333"/>
  <circle cx="180" cy="150" r="16" fill="#666"/>
  <circle cx="210" cy="120" r="8" fill="#999"/>
  <circle cx="250" cy="90" r="20" fill="#222"/>
  <circle cx="280" cy="180" r="7" fill="#555"/>
  <circle cx="300" cy="60" r="14" fill="#444"/>
  <circle cx="330" cy="220" r="9" fill="#777"/>
  <circle cx="350" cy="130" r="12" fill="#333"/>
  <circle cx="200" cy="240" r="5" fill="#aaa"/>

  <!-- annotation -->
  <line x1="250" y1="90" x2="250" y2="50" stroke="black" stroke-dasharray="3,3"/>
  <text x="250" y="45" text-anchor="middle" font-size="10">click → director, cast,</text>
  <text x="250" y="57" text-anchor="middle" font-size="10">top review keywords</text>

  <text x="140" y="255" font-size="10">"hidden gems"</text>
  <text x="300" y="45" font-size="10" text-anchor="middle">high rating +</text>
  <text x="300" y="57" font-size="10" text-anchor="middle">high discussion</text>

  <text x="210" y="315" text-anchor="middle" font-size="10" fill="#555">size = revenue   color = genre</text>
</svg>
