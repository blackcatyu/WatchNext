<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" font-family="sans-serif">
  <rect width="420" height="320" fill="white"/>
  <text x="210" y="20" text-anchor="middle" font-size="14" font-weight="bold">Actor / Director Career Timeline</text>

  <!-- timeline axis -->
  <line x1="40" y1="180" x2="390" y2="180" stroke="black" stroke-width="1.5"/>
  <text x="60" y="200" font-size="10">2005</text>
  <text x="150" y="200" font-size="10">2010</text>
  <text x="240" y="200" font-size="10">2015</text>
  <text x="330" y="200" font-size="10">2020</text>

  <!-- movies as circles above/below axis: y offset = rating, size = revenue -->
  <circle cx="70" cy="160" r="6" fill="#666"/>
  <circle cx="110" cy="140" r="10" fill="#333"/>
  <circle cx="160" cy="150" r="7" fill="#888"/>
  <circle cx="200" cy="110" r="16" fill="#222"/>
  <circle cx="240" cy="160" r="5" fill="#aaa"/>
  <circle cx="280" cy="90" r="14" fill="#444"/>
  <circle cx="320" cy="150" r="8" fill="#777"/>
  <circle cx="360" cy="120" r="12" fill="#555"/>

  <line x1="200" y1="110" x2="200" y2="180" stroke="#ccc" stroke-dasharray="2,2"/>
  <text x="200" y="100" text-anchor="middle" font-size="9">peak: rating + revenue</text>

  <text x="210" y="300" text-anchor="middle" font-size="10" fill="#555">x = release year   y-offset/size = rating &amp; revenue   color = genre</text>
</svg>
