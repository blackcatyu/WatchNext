<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" font-family="sans-serif">
  <rect width="420" height="320" fill="white"/>
  <text x="210" y="20" text-anchor="middle" font-size="14" font-weight="bold">Actor–Director Collaboration Network</text>

  <!-- edges -->
  <line x1="100" y1="80" x2="200" y2="140" stroke="#999"/>
  <line x1="100" y1="80" x2="140" y2="180" stroke="#999"/>
  <line x1="200" y1="140" x2="280" y2="90" stroke="#999"/>
  <line x1="200" y1="140" x2="140" y2="180" stroke="#999"/>
  <line x1="200" y1="140" x2="260" y2="220" stroke="#999"/>
  <line x1="280" y1="90" x2="330" y2="160" stroke="#999"/>
  <line x1="260" y1="220" x2="330" y2="160" stroke="#999"/>
  <line x1="140" y1="180" x2="90" y2="240" stroke="#999"/>

  <!-- director nodes: squares -->
  <rect x="92" y="72" width="16" height="16" fill="#222"/>
  <rect x="272" y="82" width="16" height="16" fill="#222"/>

  <!-- actor nodes: circles -->
  <circle cx="200" cy="140" r="12" fill="#666"/>
  <circle cx="140" cy="180" r="9" fill="#888"/>
  <circle cx="260" cy="220" r="10" fill="#777"/>
  <circle cx="330" cy="160" r="8" fill="#999"/>
  <circle cx="90" cy="240" r="7" fill="#aaa"/>

  <text x="30" y="290" font-size="10">▪ director</text>
  <text x="120" y="290" font-size="10">● actor</text>
  <text x="210" y="300" text-anchor="middle" font-size="10" fill="#555">node size = # movies   edges = shared credits; hover to trace a bridge person</text>
</svg>
